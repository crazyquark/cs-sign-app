# XcodeGen spec for building Plain Sign with Xcode (App Store uploads and
# screenshots in CI). Day-to-day builds use xtool (Package.swift + xtool.yml);
# both build the same sources. Run scripts/xcode-prepare.sh, not xcodegen directly:
# it creates the .xcode/ inputs this spec refers to.
name: PlainSign
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PlainSign:
    type: application
    platform: iOS
    sources:
      - path: Sources/PlainSign
      - path: .xcode/Assets.xcassets
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: PlainSign
        PRODUCT_BUNDLE_IDENTIFIER: io.github.crazyquark.plainsign
        INFOPLIST_FILE: .xcode/Info.plist
        MARKETING_VERSION: ${PS_VERSION}
        CURRENT_PROJECT_VERSION: ${PS_BUILD}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
