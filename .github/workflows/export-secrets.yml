# TEMPORARY: copies the App Store Connect secrets to another repo. Encrypts them
# to a one-time certificate passed as input; only the ciphertext leaves the run.
# Deleted right after use.
name: Export secrets (temporary)
on:
  workflow_dispatch:
    inputs:
      cert:
        description: Recipient certificate (PEM)
        required: true
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    environment: app-store
    steps:
      - name: Encrypt
        env:
          CERT: ${{ inputs.cert }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s\n' "$CERT" > cert.pem
          python3 -c 'import json,os; print(json.dumps({k: os.environ[k] for k in ("ASC_KEY_ID","ASC_ISSUER_ID","ASC_KEY_P8","APPLE_TEAM_ID")}))' \
            | openssl cms -encrypt -aes256 -binary -outform DER -out secrets.cms cert.pem
          ls -l secrets.cms
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-cms
          path: secrets.cms
          retention-days: 1
